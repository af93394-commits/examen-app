<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Simulacro ICFES - Presentacion</title>
<link rel="stylesheet" href="/css/styles.css">
<style>
body{margin:0;background:#f1f5f9}
.topo{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 20px;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
.topo .area-title{display:flex;flex-direction:column;gap:2px}
.topo #areaNombre{font-size:15px;font-weight:700;color:#1e293b}
.topo #areaSub{font-size:12px;font-weight:400;color:#64748b;display:block}
.quiz-timer{font-size:22px;font-weight:700;color:#dc2626;background:#fee2e2;padding:8px 18px;border-radius:10px}
.quiz-timer.low{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.pv-wrap{max-width:900px;margin:24px auto;padding:0 20px}
.pv-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.pv-header .n-preg{font-size:14px;color:#475569;font-weight:600}
.progress-bar{background:#e2e8f0;border-radius:6px;height:8px;overflow:hidden;margin-bottom:18px}
.progress-fill{height:100%;background:linear-gradient(90deg,#2563eb,#16a34a);transition:width .3s}
.question-card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px solid #f1f5f9}
.question-card h3{font-size:17px;color:#1e293b;margin:0 0 14px;line-height:1.5;white-space:pre-wrap}
.question-card img{max-width:100%;border-radius:8px;margin:10px 0}
.texto-lectura{background:#f0f9ff;border-left:4px solid #2563eb;border-radius:8px;padding:18px;margin-bottom:18px}
.texto-lectura h4{margin:0 0 10px;color:#1e40af;font-size:14px}
.texto-lectura p{white-space:pre-wrap;line-height:1.7;color:#334155;margin:0}
.option{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:2px solid #e2e8f0;border-radius:10px;margin-bottom:10px;cursor:pointer;transition:all .15s}
.option:hover{border-color:#2563eb;background:#eff6ff}
.option.selected{border-color:#2563eb;background:#eff6ff}
.option input{width:18px;height:18px;accent-color:#2563eb;margin-top:2px;cursor:pointer}
.option .opt-txt{flex:1;white-space:pre-wrap;line-height:1.5;color:#334155}
.nav-chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.nav-chip{width:36px;height:36px;border-radius:8px;border:2px solid #e2e8f0;background:#fff;color:#475569;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.nav-chip.answered{background:#dcfce7;border-color:#16a34a;color:#166534}
.nav-chip.current{background:#2563eb;border-color:#2563eb;color:#fff}
.nav-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
#banner{display:none;position:fixed;top:0;left:0;right:0;z-index:5000;background:#dc2626;color:#fff;padding:12px 20px;font-size:14px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.2)}
#banner a{color:#fff;text-decoration:underline;margin-left:10px;cursor:pointer}
#banner .cerrar{float:right;cursor:pointer;font-weight:700}
#debugLine{font-size:11px;color:#94a3b8;font-family:monospace;word-break:break-all;padding:2px 20px}
.cargando{display:flex;justify-content:center;padding:60px 0;color:#64748b;font-size:15px}
#borradorBtn{position:fixed;right:22px;bottom:22px;z-index:200;background:#1e293b;color:#fff;border:none;border-radius:30px;padding:13px 20px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px}
#borradorBtn:hover{background:#334155}
#borradorPanel{position:fixed;top:0;right:0;height:100%;width:min(480px,92vw);background:#fff;z-index:300;box-shadow:-4px 0 20px rgba(0,0,0,.2);display:none;flex-direction:column;transform:translateX(100%);transition:transform .2s ease}
#borradorPanel.open{display:flex;transform:translateX(0)}
.borrador-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #e2e8f0;background:#f8fafc}
.borrador-head h4{margin:0;font-size:15px;color:#1e293b}
.borrador-head .sub{font-size:12px;color:#94a3b8;font-weight:400}
.borrador-tools{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid #e2e8f0;align-items:center;flex-wrap:wrap}
.borrador-tools button{border:1px solid #e2e8f0;background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;color:#334155}
.borrador-tools button.active{background:#2563eb;color:#fff;border-color:#2563eb}
.borrador-tools input[type=color]{width:32px;height:32px;border:1px solid #e2e8f0;border-radius:8px;padding:2px;cursor:pointer}
.borrador-tools input[type=range]{width:70px}
#borradorCanvasWrap{flex:1;position:relative;overflow:hidden;background-color:#fff;background-image:linear-gradient(#e2e8f0 1px,transparent 1px),linear-gradient(90deg,#e2e8f0 1px,transparent 1px);background-size:24px 24px}
#borradorCanvas{position:absolute;top:0;left:0;touch-action:none;cursor:crosshair}
#borradorCerrar{border:none;background:transparent;font-size:20px;cursor:pointer;color:#64748b;line-height:1}
.borrador-texto{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid #e2e8f0;align-items:center;flex-wrap:wrap}
.borrador-texto input[type=text]{flex:1;min-width:140px;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;font-size:14px;color:#1e293b}
.borrador-texto input[type=text]:focus{outline:none;border-color:#2563eb}
.borrador-texto button{border:1px solid #2563eb;background:#2563eb;color:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.borrador-texto button:hover{background:#1d4ed8}
.borrador-texto .tam-txt{font-size:12px;color:#64748b;display:flex;align-items:center;gap:6px}
.borrador-texto .tam-txt input[type=range]{width:56px}
.borrador-hint{font-size:11px;color:#94a3b8;padding:6px 16px;border-top:1px solid #f1f5f9}
</style>
</head>
<body>
<div id="banner"></div>
<div class="topo">
  <div class="area-title"><span id="areaNombre">Cargando simulacro&hellip;</span><span id="areaSub" class="area-sub"></span></div>
  <div class="quiz-timer" id="quizTimer">--:--</div>
</div>
<div id="debugLine"></div>
<div class="pv-wrap" id="cuerpo"><div class="cargando">Cargando preguntas, un momento&hellip;</div></div>

<button id="borradorBtn" onclick="toggleBorrador()">&#9998; Hoja de borrador</button>
<div id="borradorPanel">
  <div class="borrador-head">
    <div><h4>Hoja de borrador<span class="sub" id="borradorSub"></span></h4></div>
    <button id="borradorCerrar" onclick="toggleBorrador()">&times;</button>
  </div>
  <div class="borrador-tools">
    <button id="toolLapiz" class="active" onclick="setHerramienta('lapiz')">&#9998; L&aacute;piz</button>
    <button id="toolBorrador" onclick="setHerramienta('goma')">&#9003; Borrar</button>
    <input type="color" id="colorLapiz" value="#1e293b" onchange="cambiarColor(this.value)">
    <input type="range" id="grosorLapiz" min="1" max="14" value="3" oninput="cambiarGrosor(this.value)">
    <button onclick="limpiarBorrador()">Limpiar hoja</button>
  </div>
  <div class="borrador-texto">
    <input type="text" id="textoBorrador" maxlength="200" placeholder="Escribe y pulsa Insertar texto &hellip;">
    <span class="tam-txt">A  <input type="range" id="tamTexto" min="10" max="40" value="18" oninput="document.getElementById('tamTextoVal').textContent=this.value">  <span id="tamTextoVal">18</span></span>
    <button onclick="insertarTexto()">Insertar texto</button>
  </div>
  <div id="borradorCanvasWrap">
    <canvas id="borradorCanvas"></canvas>
  </div>
  <div class="borrador-hint">Uso libre para tus c&aacute;lculos, no se guarda ni se califica. Se limpia al pasar de materia, igual que en la prueba real.</div>
</div>

<script>
var params=new URLSearchParams(window.location.search);
var simulacroId=params.get('simulacro');
var VERSION='7';
var bloques=[], simulActual=null, bloqueActual=null, preguntas=[], respuestas={};
var indexActual=0, timerInterval=null, ocupado=false;

function debug(msg){
  var el=document.getElementById('debugLine');
  if(el){
    el.style.display='block';
    el.textContent=new Date().toLocaleTimeString()+' '+msg;
  }
}
function banner(msg){
  var b=document.getElementById('banner');
  if(!b){
    b=document.createElement('div');
    b.id='banner';
    b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:5000;background:#dc2626;color:#fff;padding:12px 20px;font-size:14px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.2)';
    document.body.insertBefore(b,document.body.firstChild);
  }
  b.style.display='block';
  b.innerHTML='&#9888; '+msg+' <a onclick="location.reload()">Reintentar</a> <a onclick="window.location.href=\'/student/simulacro-config.html\'">Volver</a>';
}
function el(id){
  var e=document.getElementById(id);
  if(!e)banner('Pagina desactualizada: falta el elemento #'+id+'. Pulsa Ctrl+F5 para recargar sin cache.');
  return e;
}
window.addEventListener('error',function(e){debug('JS: '+(e.message||'error'));});
window.addEventListener('unhandledrejection',function(e){
  var r=e.reason;
  debug('Promesa: '+(r&&r.message?r.message:(r?String(r):'rechazada')));
});

if(!simulacroId){
  window.location.href='/student/simulacro-config.html';
} else if(params.get('v')!==VERSION){
  window.location.replace('/student/simulacro-presentar.html?simulacro='+simulacroId+'&v='+VERSION);
}

function fetchJson(url,opts){
  opts=opts||{};
  opts.cache='no-store';
  var timeoutMs=opts.timeoutMs||15000;
  if(typeof AbortController!=='undefined'){
    var ac=new AbortController();
    var to=setTimeout(function(){ac.abort()},timeoutMs);
    opts.signal=ac.signal;
    return fetch(url,opts).then(function(r){
      clearTimeout(to);
      return r.text().then(function(txt){
        var d=null;
        try{d=JSON.parse(txt)}catch(e){d={error:'Respuesta no JSON (HTTP '+r.status+')'};}
        debug(url.replace('/api/','')+' -> '+r.status);
        return {ok:r.ok,status:r.status,data:d};
      });
    }).catch(function(e){
      clearTimeout(to);
      if(e&&e.name==='AbortError')throw new Error('Timeout: el servidor no respondio en '+Math.round(timeoutMs/1000)+'s');
      throw e;
    });
  }
  return fetch(url,opts).then(function(r){
    return r.text().then(function(txt){
      var d=null;
      try{d=JSON.parse(txt)}catch(e){d={error:'Respuesta no JSON (HTTP '+r.status+')'};}
      debug(url.replace('/api/','')+' -> '+r.status);
      return {ok:r.ok,status:r.status,data:d};
    });
  });
}

fetch('/api/sesion',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
  if(d.user.rol!=='estudiante')window.location.href='/';
  cargarEstado(0);
}).catch(function(){window.location.href='/'});

function cargarEstado(intento){
  intento=intento||0;
  if(intento===0)debug('Estado...');
  var to=intento===0?90000:20000;
  fetchJson('/api/simulacros/'+simulacroId,{timeoutMs:to}).then(function(j){
    if(!j.ok){
      var msj=(j.data&&j.data.error)||('HTTP '+j.status);
      var transitorio=(j.status>=500||j.status===529||msj.indexOf('Respuesta no JSON')===0);
      if(transitorio&&intento<8){
        setTimeout(function(){cargarEstado(intento+1)},5000);
        return;
      }
      banner(msj);
      return;
    }
    simulActual=j.data.simulacro;
    bloques=j.data.bloques;
    if(simulActual.estado==='finalizado'){
      window.location.href='/student/simulacro-resultados.html?simulacro='+simulacroId;
      return;
    }
    if(!bloques||bloques.length===0){
      banner('Este simulacro no tiene bloques. Generalo de nuevo.');
      return;
    }
    procesarBloque();
  }).catch(function(e){
    if(intento<8){
      setTimeout(function(){cargarEstado(intento+1)},5000);
      return;
    }
    banner('No se pudo conectar con el servidor: '+(e.message||'error').slice(0,80));
  });
}

function procesarBloque(){
  bloqueActual=null;
  bloques.forEach(function(b){if(b.orden===simulActual.bloque_actual)bloqueActual=b;});
  if(!bloqueActual)bloqueActual=bloques[0];

  var an=el('areaNombre');
  var as=el('areaSub');
  if(an)an.textContent=bloqueActual.materia_nombre;
  if(as)as.textContent='Bloque '+(bloqueActual.orden+1)+' de '+bloques.length+' ('+bloqueActual.total_preguntas+' preguntas)';

  if(bloqueActual.finalizado_en){
    avanzarSiguiente();
    return;
  }
  if(ocupado)return;
  ocupado=true;

  var p = bloqueActual.iniciado_en
    ? Promise.resolve({ok:true,data:{bloque:bloqueActual}})
    : fetchJson('/api/simulacros/'+simulacroId+'/bloques/'+bloqueActual.id+'/iniciar',{method:'POST'});

  p.then(function(j){
    ocupado=false;
    if(!j.ok){
      banner(j.data.error||('No se pudo iniciar el bloque (HTTP '+j.status+')'));
      return;
    }
    if(j.data.bloque)bloqueActual.iniciado_en=j.data.bloque.iniciado_en||new Date().toISOString();
    cargarPreguntas();
  }).catch(function(e){
    ocupado=false;
    banner('No se pudo iniciar el bloque: '+(e.message||'desconocido'));
  });
}

function cargarPreguntas(){
  var as=el('areaSub');
  if(as)as.textContent='Cargando preguntas...';
  fetchJson('/api/simulacros/'+simulacroId+'/bloques/'+bloqueActual.id+'/preguntas',{timeoutMs:60000})
    .then(function(j){
      if(!j.ok){banner(j.data.error||('Error cargando preguntas (HTTP '+j.status+')'));return;}
      var d=j.data;
      preguntas=d.preguntas||[];
      respuestas={};
      preguntas.forEach(function(p){if(p.respuesta_seleccionada)respuestas[p.id]=p.respuesta_seleccionada;});
      if(preguntas.length===0){
        finalizarBloque(true);
        return;
      }
      indexActual=0;
      iniciarTimer(d.tiempo_limite_segundos, d.iniciado_en);
      renderBloque();
    }).catch(function(e){banner('Error cargando las preguntas: '+(e.message||'desconocido'));});
}

function clearTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null;}}

function iniciarTimer(segundos,iniciadoEn){
  clearTimer();
  var fin=new Date(iniciadoEn).getTime()+segundos*1000;
  timerInterval=setInterval(function(){
    var rem=Math.max(0,Math.round((fin-Date.now())/1000));
    pintarTiempo(rem);
    if(rem<=0){
      clearInterval(timerInterval);
      finalizarBloque(true);
    }
  },1000);
  pintarTiempo(Math.max(0,Math.round((fin-Date.now())/1000)));
}

function pintarTiempo(seg){
  var e=el('quizTimer');
  if(!e)return;
  var m=Math.floor(seg/60),s=seg%60;
  e.textContent=m+':'+s.toString().padStart(2,'0');
  e.classList.toggle('low',seg<300);
}

function renderBloque(){
  var cont=el('cuerpo');
  if(!cont){banner('Elemento #cuerpo faltante - recarga con Ctrl+F5');return;}
  var respondidas=Object.keys(respuestas).length;
  var haySiguiente=false;
  bloques.forEach(function(b){if(b.orden===bloqueActual.orden+1)haySiguiente=true;});

  var html='<div class="pv-header">';
  html+='<span class="n-preg"><strong>'+bloqueActual.materia_nombre+'</strong> &middot; '+preguntas.length+' preguntas de esta materia</span>';
  html+='<span id="resumenResp" style="font-size:13px;color:#64748b">'+respondidas+' respondidas de '+preguntas.length+'</span>';
  html+='</div>';
  html+='<div class="progress-bar"><div class="progress-fill" id="fillResp" style="width:'+Math.round((respondidas/preguntas.length)*100)+'%"></div></div>';

  preguntas.forEach(function(p,i){
    html+='<div class="question-card" style="margin-bottom:18px">';
    if(p.texto_lectura_contenido){
      html+='<div class="texto-lectura"><h4>&#128214; Texto de lectura</h4><p>'+p.texto_lectura_contenido+'</p>';
      if(p.texto_lectura_imagen)html+='<img src="'+p.texto_lectura_imagen+'" style="max-width:100%;border-radius:8px;margin-top:10px;border:1px solid #e2e8f0">';
      html+='</div>';
    }
    html+='<h3>'+(p.orden_pregunta||(i+1))+'. '+p.texto+'</h3>';
    if(p.imagen)html+='<img src="'+p.imagen+'" alt="Imagen de la pregunta">';
    ['A','B','C','D'].forEach(function(opt){
      var val=p['opcion_'+opt.toLowerCase()];
      var imgVal=p['imagen_opcion_'+opt.toLowerCase()];
      var sel=respuestas[p.id]===opt?' selected':'';
      html+='<div class="option'+sel+'" onclick="seleccionar('+p.id+',\''+opt+'\',this)">';
      html+='<input type="radio" name="q'+p.id+'" value="'+opt+'"'+(respuestas[p.id]===opt?' checked':'')+'>';
      html+='<div class="opt-txt"><strong>'+opt+')</strong> ';
      if(imgVal)html+='<img src="'+imgVal+'" style="max-width:220px;max-height:110px;border-radius:6px;display:block;margin:6px 0">';
      if(val)html+=val;
      html+='</div></div>';
    });
    html+='</div>';
  });

  html+='<div class="nav-actions" style="padding:18px;background:#fff;border-radius:14px;border:1px solid #f1f5f9">';
  html+='<div style="font-size:13px;color:#64748b;margin-bottom:10px">'+respondidas+' de '+preguntas.length+' respondidas. Tu progreso se guarda automaticamente.</div>';
  if(haySiguiente){
    html+='<button class="btn btn-success" style="width:100%" onclick="finalizarBloque()">Continuar a la siguiente materia &#8594;</button>';
  }else{
    html+='<button class="btn btn-success" style="width:100%" onclick="finalizarBloque()">Finalizar simulacro y ver resultados &#8594;</button>';
  }
  html+='</div>';

  cont.innerHTML=html;
  window.scrollTo(0,0);
}

function seleccionar(pid,opt,el){
  respuestas[pid]=opt;
  var grupo=el.parentElement.querySelectorAll('.option');
  for(var i=0;i<grupo.length;i++)grupo[i].classList.remove('selected');
  el.classList.add('selected');
  var radio=el.querySelector('input[type=radio]');
  if(radio)radio.checked=true;
  var res=document.getElementById('resumenResp');
  var fill=document.getElementById('fillResp');
  if(res)res.textContent=Object.keys(respuestas).length+' respondidas de '+preguntas.length;
  if(fill)fill.style.width=Math.round((Object.keys(respuestas).length/preguntas.length)*100)+'%';
  fetch('/api/simulacros/'+simulacroId+'/bloques/'+bloqueActual.id+'/responder',{
    method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({pregunta_id:pid,respuesta_seleccionada:opt})
  }).catch(function(){debug('No se pudo guardar la respuesta');});
}

function finalizarBloque(silencioso){
  if(!silencioso){
    var haySiguiente=false;
    bloques.forEach(function(b){if(b.orden===bloqueActual.orden+1)haySiguiente=true;});
    var msg=haySiguiente
      ? 'Continuar a la siguiente materia. Las respuestas se guardan y no volver&aacute;s a "'+bloqueActual.materia_nombre+'".'
      : 'Finalizar el simulacro y ver resultados. Las respuestas se guardan y no volver&aacute;s a "'+bloqueActual.materia_nombre+'".';
    if(!confirm(msg))return;
  }
  if(ocupado)return;
  ocupado=true;
  clearTimer();
  fetchJson('/api/simulacros/'+simulacroId+'/bloques/'+bloqueActual.id+'/finalizar',{method:'PUT'})
    .then(function(j){
      ocupado=false;
      if(!j.ok){banner(j.data.error||('Error finalizando (HTTP '+j.status+')'));return;}
      if(j.data.simulacro_finalizado){
        limpiarBorrador();
        window.location.href='/student/simulacro-resultados.html?simulacro='+simulacroId;
      }else{
        limpiarBorrador();
        simulActual.bloque_actual=simulActual.bloque_actual+1;
        var cu=el('cuerpo');
        if(cu)cu.innerHTML='<div class="cargando">Cargando la siguiente materia...</div>';
        var an=el('areaNombre');
        if(an)an.textContent='Cargando siguiente materia...';
        procesarBloque();
      }
    }).catch(function(e){ocupado=false;banner('Error finalizando: '+e.message);});
}

function avanzarSiguiente(){
  var sig=null;
  bloques.forEach(function(b){if(b.orden===bloqueActual.orden+1)sig=b;});
  if(sig){
    simulActual.bloque_actual=sig.orden;
    limpiarBorrador();
    procesarBloque();
  }else{
    window.location.href='/student/simulacro-resultados.html?simulacro='+simulacroId;
  }
}

/* ---------- Hoja de borrador ---------- */
var bCanvas=null, bCtx=null, bDibujando=false, bHerramienta='lapiz', bColor='#1e293b', bGrosor=3, bLast=null;

function toggleBorrador(){
  var panel=el('borradorPanel');
  if(!panel)return;
  var abierto=panel.classList.toggle('open');
  if(abierto){
    var sub=el('borradorSub');
    if(sub)sub.textContent=bloqueActual?(' &middot; '+bloqueActual.materia_nombre):'';
    setTimeout(initBorradorCanvas,10);
  }
}

function initBorradorCanvas(){
  var wrap=el('borradorCanvasWrap');
  bCanvas=el('borradorCanvas');
  if(!bCanvas||!wrap)return;
  var w=wrap.clientWidth, h=wrap.clientHeight;
  if(bCanvas.width!==w||bCanvas.height!==h){
    var prev=null;
    if(bCanvas.width>0&&bCanvas.height>0){try{prev=bCanvas.toDataURL();}catch(e){}}
    bCanvas.width=w; bCanvas.height=h;
    bCtx=bCanvas.getContext('2d');
    bCtx.lineCap='round'; bCtx.lineJoin='round';
    if(prev){var img=new Image(); img.onload=function(){bCtx.drawImage(img,0,0);}; img.src=prev;}
  } else if(!bCtx){
    bCtx=bCanvas.getContext('2d');
    bCtx.lineCap='round'; bCtx.lineJoin='round';
  }
  if(!bCanvas.dataset.bound){
    bCanvas.dataset.bound='1';
    bCanvas.addEventListener('pointerdown',bStart);
    bCanvas.addEventListener('pointermove',bMove);
    window.addEventListener('pointerup',bEnd);
    window.addEventListener('pointercancel',bEnd);
    window.addEventListener('resize',function(){setTimeout(initBorradorCanvas,50);});
  }
}

function getPos(e){
  var r=bCanvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
function bStart(e){
  bDibujando=true;
  bLast=getPos(e);
  e.preventDefault();
}
function bMove(e){
  if(!bDibujando||!bCtx)return;
  var p=getPos(e);
  if(bHerramienta==='goma'){
    bCtx.globalCompositeOperation='destination-out';
    bCtx.strokeStyle='rgba(0,0,0,1)';
    bCtx.lineWidth=Math.max(bGrosor*5,18);
  }else{
    bCtx.globalCompositeOperation='source-over';
    bCtx.strokeStyle=bColor;
    bCtx.lineWidth=bGrosor;
  }
  bCtx.beginPath();
  bCtx.moveTo(bLast.x,bLast.y);
  bCtx.lineTo(p.x,p.y);
  bCtx.stroke();
  bCtx.globalCompositeOperation='source-over';
  bLast=p;
  e.preventDefault();
}
function bEnd(){bDibujando=false;}

function setHerramienta(t){
  bHerramienta=t;
  var lp=el('toolLapiz');
  var bo=el('toolBorrador');
  if(lp)lp.classList.toggle('active',t==='lapiz');
  if(bo)bo.classList.toggle('active',t==='goma');
}
function cambiarColor(c){
  bColor=c;
  if(bHerramienta==='goma')setHerramienta('lapiz');
}
function cambiarGrosor(v){bGrosor=parseInt(v,10);}
function limpiarBorrador(){
  if(bCtx&&bCanvas)bCtx.clearRect(0,0,bCanvas.width,bCanvas.height);
}

function insertarTexto(){
  var inp=el('textoBorrador');
  if(!inp||!bCtx||!bCanvas)return;
  var txt=inp.value;
  if(!txt||!txt.trim())return;
  var tam=parseInt(document.getElementById('tamTexto').value,10)||18;
  bCtx.globalCompositeOperation='source-over';
  bCtx.fillStyle=bColor;
  bCtx.font='600 '+tam+'px Arial, sans-serif';
  bCtx.textBaseline='top';
  var anchoMax=bCanvas.width-24;
  var x=(bLast&&bLast.x&&bLast.x>0)?bLast.x:12;
  var y=(bLast&&bLast.y&&bLast.y>0)?bLast.y:12;
  var lineas=txt.split('\n');
  var yLinea=y;
  lineas.forEach(function(lin){
    var palabras=lin.split(' ');
    var actual='';
    for(var i=0;i<palabras.length;i++){
      var prueba=actual?actual+' '+palabras[i]:palabras[i];
      if(bCtx.measureText(prueba).width>anchoMax&&actual){
        bCtx.fillText(actual,x,yLinea);
        yLinea+=tam*1.3;
        actual=palabras[i];
      }else{
        actual=prueba;
      }
    }
    if(actual){bCtx.fillText(actual,x,yLinea);}
    yLinea+=tam*1.3;
  });
  inp.value='';
  inp.focus();
}
</script>
</body></html>
