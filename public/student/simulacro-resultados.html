<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Simulacro ICFES - Resultados</title>
<link rel="stylesheet" href="/css/styles.css">
<style>
body{margin:0;background:#f1f5f9}
.top-bar{background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.top-bar h2{margin:0;font-size:18px;color:#1e293b}
.res-wrap{max-width:860px;margin:26px auto;padding:0 20px}
.global-card{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-radius:16px;padding:30px;text-align:center;margin-bottom:22px}
.global-card .label{font-size:14px;color:#bfdbfe}
.global-card .score{font-size:52px;font-weight:800;margin:6px 0}
.global-card .nivel{display:inline-block;background:rgba(255,255,255,.2);border-radius:20px;padding:6px 18px;font-weight:700;font-size:15px}
.global-card .det{font-size:13px;color:#dbeafe;margin-top:14px}
.area-card{background:#fff;border-radius:14px;padding:20px 22px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:16px;border:1px solid #f1f5f9}
.area-head{display:flex;align-items:center;gap:12px;cursor:pointer}
.area-head .nombre{font-size:16px;font-weight:700;color:#1e293b;flex:1}
.area-head .barra-m{background:#e2e8f0;border-radius:6px;height:8px;width:180px;overflow:hidden}
.area-head .barra-f{height:100%;background:#16a34a;border-radius:6px}
.area-head .puntaje{font-size:18px;font-weight:800;color:#1e293b;width:56px;text-align:right}
.area-head .nivel-sm{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;text-transform:uppercase}
.nivel.Satisfactorio{background:#dcfce7;color:#166534}
.nivel.Minimo{background:#fef3c7;color:#b45309}
.nivel.Insuficiente{background:#fee2e2;color:#b91c1c}
.nivel.Avanzado{background:#dbeafe;color:#1e40af}
.rev{padding-top:16px;margin-top:14px;border-top:1px solid #e2e8f0}
.rev-q{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-bottom:10px}
.rev-q h5{margin:0 0 6px;font-size:14px;color:#1e293b;white-space:pre-wrap}
.rev-q .opt-line{font-size:13px;padding:3px 0}
.rev-q .opt-line.ok{color:#16a34a;font-weight:700}
.rev-q .opt-line.bad{color:#dc2626;font-weight:700}
.res-actions{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.nota{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:10px;padding:12px 16px;font-size:13px;margin-bottom:20px}
</style>
</head>
<body>
<div class="top-bar">
  <h2>&#127979; Resultados del Simulacro ICFES</h2>
  <div class="res-actions-top" style="display:flex;gap:10px">
    <a href="/student/resultados.html?tab=simulacros" class="btn btn-secondary btn-sm">&#8592; Todos mis resultados</a>
    <a href="/student/simulacro-config.html" class="btn btn-primary btn-sm">Nuevo simulacro</a>
  </div>
</div>
<div class="res-wrap" id="res"></div>

<script>
var params=new URLSearchParams(window.location.search);
var simulacroId=params.get('simulacro');

fetch('/api/sesion').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
  if(d.user.rol!=='estudiante')window.location.href='/';
  if(!simulacroId)window.location.href='/student/simulacro-config.html';
  cargarResultados();
}).catch(function(){window.location.href='/'});

function cargarResultados(){
  fetch('/api/simulacros/'+simulacroId+'/resultados').then(function(r){return r.json()}).then(function(d){
    if(d.error){document.getElementById('res').innerHTML='<div class="card"><p>'+d.error+'</p></div>';return;}
    renderGlobal(d);
    document.getElementById('res').innerHTML+=d.nota?'<div class="nota">'+d.nota+'</div>':'';
    d.detalle.forEach(function(a){
      renderArea(a);
    });
    var acciones='<div class="res-actions">';
    acciones+='<a href="/student/simulacro-config.html" class="btn btn-primary">&#9654; Presentar nuevo simulacro</a>';
    acciones+='<a href="/student/dashboard.html" class="btn btn-secondary">Ir al inicio</a>';
    acciones+='</div>';
    document.getElementById('res').insertAdjacentHTML('beforeend',acciones);
  }).catch(function(){
    document.getElementById('res').innerHTML='<div class="card empty-state"><p>No se pudieron cargar los resultados</p></div>';
  });
}

function renderGlobal(d){
  var html='<div class="global-card">';
  html+='<div class="label">PUNTAJE GLOBAL SIMULADO (escala oficial 0-500)</div>';
  html+='<div class="score">'+d.puntaje_global+'</div>';
  html+='<div><span class="nivel '+d.puntaje_global_nivel+'">'+d.puntaje_global_nivel+'</span></div>';
  html+='<div class="det">'+d.total_bloques+' bloques &middot; Ponderaci&oacute;n oficial Lectura 3 &middot; Matem&aacute;ticas 3 &middot; Sociales 3 &middot; Naturales 3 &middot; Ingl&eacute;s 1</div>';
  html+='</div>';
  document.getElementById('res').style.display='block';
  document.getElementById('res').innerHTML=html;
}

function renderArea(a){
  var acc=document.getElementById('res');
  var pct=a.correctas>0?Math.round(a.correctas*100/a.total_preguntas):0;
  var html='<div class="area-card">';
  html+='<div class="area-head" onclick="toggleArea('+a.bloque_id+')">';
  html+='<div class="nombre">'+a.materia_nombre+' <span style="font-weight:400;color:#94a3b8;font-size:12px">('+a.correctas+'/'+a.total_preguntas+' correctas)</span></div>';
  html+='<div class="barra-m"><div class="barra-f" style="width:'+pct+'%"></div></div>';
  html+='<div class="puntaje">'+a.puntaje_area+'</div>';
  html+='<span class="nivel '+a.puntaje_area_nivel+'">'+a.puntaje_area_nivel+'</span>';
  html+='</div>';
  html+='<div class="rev" id="rev-'+a.bloque_id+'" style="display:none">';
  a.preguntas.forEach(function(p){
    var esOk=p.es_correcta===1;
    html+='<div class="rev-q">';
    html+='<h5>'+p.orden_pregunta+'. '+p.texto+'</h5>';
    html+='<div class="rev-line"><span class="opt-line ok">Correcta: '+p.respuesta_correcta+')</span>';
    html+='<span class="opt-line '+(esOk?'ok':'bad')+'"> &nbsp; Tu respuesta: '+(p.respuesta_seleccionada?p.respuesta_seleccionada+')':'—')+'</span></div>';
    html+='</div>';
  });
  html+='</div>';
  html+='</div>';
  acc.insertAdjacentHTML('beforeend',html);
}

function toggleArea(id){
  var el=document.getElementById('rev-'+id);
  if(el)el.style.display=el.style.display==='none'?'block':'none';
}
</script>
</body></html>
